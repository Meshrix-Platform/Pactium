name: CI

on:
  push:
    branches: [stable, main, nightly]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Upgrade npm outside the project tree: the Node 22 image bundles
      # npm 10, which refuses on devEngines.packageManager before it can
      # self-upgrade; the OIDC publish floor needs npm >= 11.5.1.
      # publish.yml's verify job uses the same step — keep both paths aligned.
      - run: cd "$RUNNER_TEMP" && npm install -g npm@latest
      - run: npm ci
      - run: npm run verify:release
